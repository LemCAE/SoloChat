# Gradle 构建参数（项目级，不影响系统上其他项目）

# 用不驻留的守护进程：这台机器上 Gradle/Kotlin 的守护进程之间靠命名管道通信，
# 而当前的 DSH 沙箱不允许子进程打开命名管道，于是会出现
# "Could not connect to Kotlin compile daemon"。强制进程内编译即可绕开。
# 代价是每次编译冷启动，但这个项目的核心模块只有几十个文件，实测 30 秒左右。
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# JVM 参数。`-Duser.home` 指向工作区内，是因为 AGP 的 debug 签名密钥固定在
# `$user.home/.android/debug.keystore`，而沙箱不允许写用户主目录
# （validateSigningDebug 报 AccessDeniedException: C:\Users\tenge\.android\debug.keystore.lock）。
# 改 user.home 之后 keytool 会在这里自动生成密钥；换机器构建会得到不同的密钥，
# 所以它只用于 debug，**不要**拿它签正式包。
#
# ⚠️ 注意 `android.debug.keystore` **不生效**（曾试过）：AGP 8.x 解析 debug 密钥时
# 不看这个属性，只看 user.home / ANDROID_SDK_HOME。
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Duser.home=D:/Project/QQBot/SoloChat/.userhome

# AndroidX：所有依赖必须显式声明版本（避免传递依赖带来的意外升级）
android.useAndroidX=true
android.nonTransitiveRClass=true

# 构建缓存：把 task 级产物留在项目内，重复构建快很多
org.gradle.caching=true
org.gradle.parallel=true

# 关掉文件系统监视：沙箱下 native watcher 起不来（"Couldn't open current thread, error = 5"），
# 而且它对本项目的增量收益有限。
org.gradle.vfs.watch=false

# debug 签名密钥的位置（**这一项无效，保留作为说明**）。
#
# AGP 8.x 不看 `android.debug.keystore`，它固定读 `$user.home/.android/debug.keystore`。
# 真正的解决办法是上面 jvmargs 里的 -Duser.home。这里记一笔，避免以后有人
# 又照着旧文档去改这个属性然后白试一轮。
android.debug.keystore=../../.android-debug/debug.keystore
