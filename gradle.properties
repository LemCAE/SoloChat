# Gradle 构建参数（项目级，不影响系统上其他项目）

# 用不驻留的守护进程：这台机器上 Gradle/Kotlin 的守护进程之间靠命名管道通信，
# 而当前的 DSH 沙箱不允许子进程打开命名管道，于是会出现
# "Could not connect to Kotlin compile daemon"。强制进程内编译即可绕开。
# 代价是每次编译冷启动，但这个项目的核心模块只有几十个文件，实测 30 秒左右。
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# JVM 参数不写开发机绝对路径；签名目录由 tools/build.ps1 的 ANDROID_PREFS_ROOT 设置。
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# AndroidX：所有依赖必须显式声明版本（避免传递依赖带来的意外升级）
android.useAndroidX=true
android.nonTransitiveRClass=true

# 构建缓存：把 task 级产物留在项目内，重复构建快很多
org.gradle.caching=true
org.gradle.parallel=true

# 关掉文件系统监视：沙箱下 native watcher 起不来（"Couldn't open current thread, error = 5"），
# 而且它对本项目的增量收益有限。
org.gradle.vfs.watch=false
