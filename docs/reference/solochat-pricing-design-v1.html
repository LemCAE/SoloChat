 {id:'custom',name:'自定义接口 · 日常聊天',mark:'自',migrated:true,models:[{id:'custom-chat',name:'角色对话 · 温柔而坚定',request:'custom/character-chat'}],quotes:{},unassigned:[],archives:[]},

 if(!q)return '<p class="quiet">未配置价格</p>';
 const rates=r=>'输入 '+num(r.input)+' · 输出 '+num(r.output)+' · 缓存 '+num(r.cached);
 return '<p class="quiet">'+esc((q.peakEnabled?'谷价：':'标准价：')+rates(q.standard))+'</p><p class="quiet">'+esc(q.peakEnabled?'峰谷已启用':'峰谷未启用')+'</p>'+

 (q.calendarEnabled?'<p class="quiet">日历：'+esc(q.from)+' 至 '+esc(q.through)+' · '+(q.calendarConfirmed?'已核对':'待核对')+'<br>排除日期：'+esc(q.excluded||'无')+'<br>额外适用：'+esc(q.included||'无')+'<br>来源：'+esc(q.calendarSource||'未记录')+'</p>':'<p class="quiet">未使用日历</p>')+'<p class="quiet">报价来源：'+esc(q.source)+'</p>'+(q.note?'<p class="quiet">'+esc(q.note)+'</p>':'');

const demos=[new PricingDemo(document.getElementById('light-app')),new PricingDemo(document.getElementById('dark-app'))];
