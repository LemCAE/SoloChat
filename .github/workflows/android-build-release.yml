name: Android release

on:
  # published 同时覆盖正式发布与预发布；保存草稿、普通推送和 PR 均不构建。
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SOLOCHAT_VERSION_NAME: ${{ github.event.release.tag_name }}
      SOLOCHAT_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.SOLOCHAT_KEYSTORE_BASE64 }}
          SOLOCHAT_KEYSTORE_PASSWORD: ${{ secrets.SOLOCHAT_KEYSTORE_PASSWORD }}
          SOLOCHAT_KEY_ALIAS: ${{ secrets.SOLOCHAT_KEY_ALIAS }}
          SOLOCHAT_KEY_PASSWORD: ${{ secrets.SOLOCHAT_KEY_PASSWORD }}
        run: |
          foreach ($name in @('KEYSTORE_BASE64', 'SOLOCHAT_KEYSTORE_PASSWORD', 'SOLOCHAT_KEY_ALIAS', 'SOLOCHAT_KEY_PASSWORD')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "缺少发布签名 Secret：$name" }
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'solochat-release.p12'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "SOLOCHAT_KEYSTORE_PATH=$keyPath" >> $env:GITHUB_ENV

      - name: Test and build release APK
        shell: pwsh
        env:
          SOLOCHAT_KEYSTORE_PASSWORD: ${{ secrets.SOLOCHAT_KEYSTORE_PASSWORD }}
          SOLOCHAT_KEY_ALIAS: ${{ secrets.SOLOCHAT_KEY_ALIAS }}
          SOLOCHAT_KEY_PASSWORD: ${{ secrets.SOLOCHAT_KEY_PASSWORD }}
        run: ./tools/build.ps1 :core:test :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Remove release signing key
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'solochat-release.p12') -Force -ErrorAction SilentlyContinue

      - name: Upload test reports
        # 成功结果在构建日志中可见；只在失败时保留排查报告。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: solochat-tests-${{ github.sha }}
          path: |
            core/build/test-results/test/
            app/build/test-results/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: solochat-${{ github.sha }}-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to published release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          prerelease: ${{ github.event.release.prerelease }}
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/app-release.apk
