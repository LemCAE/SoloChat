name: Android build and publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Android SDK path
        shell: pwsh
        run: Set-Content -Path local.properties -Value "sdk.dir=$env:ANDROID_HOME" -Encoding ASCII

      - name: Build debug APK
        shell: pwsh
        run: .\gradlew.bat :core:test :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: solochat-${{ github.ref_name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
